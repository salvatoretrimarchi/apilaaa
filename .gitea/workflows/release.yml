name: release

# The Gitea counterpart of .github/workflows/release.yml. Same trigger, same
# archive names, same checksum file — but everything is built on one Linux
# runner, so the two macOS targets are not here: cross-compiling for Darwin
# needs Apple's SDK, which cannot be redistributed onto a Linux runner. Those
# two archives exist only in the GitHub release.
#
#     git tag -a v0.1.0 -m "apilaaa 0.1.0" && git push gitea v0.1.0
#
# Requires an act_runner registered against this instance, advertising the
# ubuntu-latest label and able to reach the network to fetch rustup and the
# checkout action.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$tag"         >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # The act images run as root and carry no sudo, while a runner on the
      # host usually has sudo and is not root. This works either way.
      - name: System packages
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates zip jq musl-tools mingw-w64

      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust targets
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-gnu

      - name: Build
        env:
          CARGO_TERM_COLOR: always
          # Matches the GitHub workflow: the release profile in Cargo.toml
          # already sets lto and codegen-units, this only drops the symbols.
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          for target in x86_64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl \
                        x86_64-pc-windows-gnu; do
            cargo build --release --locked --target "$target"
          done

      - name: Package
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl \
                        x86_64-pc-windows-gnu; do
            name="apilaaa-${VERSION}-${target}"
            mkdir "$name"
            cp README.md LICENSE "$name/"
            if [ "$target" = "x86_64-pc-windows-gnu" ]; then
              cp "target/$target/release/apilaaa.exe" "$name/"
              zip -qr "dist/$name.zip" "$name"
            else
              cp "target/$target/release/apilaaa" "$name/"
              tar czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$name"
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Gitea has no gh CLI, so the release goes through its own API. The
      # token is the one Actions injects for this repository.
      - name: Create or update the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"

          id=$(curl -sS -H "$auth" "$api/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
                   -d "$(jq -n --arg t "$TAG" \
                        '{tag_name:$t, name:$t, draft:false, prerelease:false}')" \
                   "$api/releases" | jq -r '.id')
            echo "created release $id for $TAG"
          else
            echo "reusing release $id for $TAG"
          fi

          assets=$(curl -sS -H "$auth" "$api/releases/$id/assets")
          for path in dist/*; do
            file=$(basename "$path")
            # Replacing rather than adding keeps a re-run idempotent: Gitea
            # would otherwise store a second asset under a suffixed name.
            old=$(echo "$assets" | jq -r --arg n "$file" \
                    '.[] | select(.name==$n) | .id' | head -1)
            if [ -n "$old" ]; then
              curl -sS -X DELETE -H "$auth" "$api/releases/$id/assets/$old" >/dev/null
            fi
            curl -sS -X POST -H "$auth" -F "attachment=@$path" \
                 "$api/releases/$id/assets?name=$file" >/dev/null
            echo "uploaded $file"
          done
