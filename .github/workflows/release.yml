name: release

# Two channels out of one pipeline:
#
#   push to main   -> refreshes the `latest` prerelease with the tip's binaries
#   push a v* tag  -> cuts an immutable release for that version
#
# The rolling channel is tagged `latest` rather than `main`, because a
# refs/tags/main next to refs/heads/main makes every `git checkout main`
# ambiguous.
#
#     git tag -a v0.1.0 -m "apilaaa 0.1.0" && git push origin v0.1.0
#
# workflow_dispatch runs the tag channel against a tag that already exists.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The release profile in Cargo.toml already sets lto and codegen-units; this
  # only drops the symbol table, which halves the size of the shipped binary.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Gitea mirrors this repository and reads .github/workflows too, where it
    # would find macos runners it cannot schedule. Keep this guard.
    if: github.server_url == 'https://github.com'
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked against musl: runs on any glibc, including the
          # older distributions an observatory machine tends to be stuck on.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the Apple Silicon runner: the Xcode toolchain
          # there targets x86_64 natively, so no Intel runner is needed.
          - target: x86_64-apple-darwin
            os: macos-latest
          # ARM Linux, if you ever want it — the runner label is GA for public
          # repositories, so this is one uncomment away:
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the channel
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: bash .github/release-identity.sh

      - name: Install the Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked builds exactly what Cargo.lock pins, vendored rawloader
      # included, so the published binary matches the tree it was built from.
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="apilaaa-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/apilaaa" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "apilaaa-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/apilaaa.exe" $name
          Copy-Item README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the channel
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: bash .github/release-identity.sh

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = "rolling" ]; then
            # Delete and recreate so the tag moves to the new tip. The release
            # is a prerelease, which keeps GitHub's "Latest" label on the real
            # versioned releases rather than on this one.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest build from main" \
              --notes "Built from \`$GITHUB_SHA\` on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          These binaries track the tip of \`main\` and are replaced on every
          merge. \`apilaaa --version\` reports the version in \`Cargo.toml\`,
          which is not bumped per merge — the commit above is what identifies
          this build. For a fixed version, use a \`v*\` release."
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* \
                --title "$TAG" \
                --generate-notes \
                --verify-tag
            fi
          fi
