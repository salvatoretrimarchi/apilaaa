name: release

# Where the binaries come from:
#
#   push to main        a release, versioned one patch above the highest v* tag
#   push a v* tag       a release at exactly that version (how a minor or major
#                       bump is made; the patch counter carries on from it)
#   manual run          artifacts on the run only — no tag, no release, whatever
#                       branch was selected
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The release profile in Cargo.toml already sets lto and codegen-units; this
  # only drops the symbol table, which halves the size of the shipped binary.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Gitea mirrors this repository and reads .github/workflows too, where it
    # would find macos runners it cannot schedule. Keep this guard.
    if: github.server_url == 'https://github.com'
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-x86_64
          # Statically linked against musl: runs on any glibc, including the
          # older distributions an observatory machine tends to be stuck on.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            label: linux-x86_64-static
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            label: windows-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            label: macos-arm64
          # Cross-compiled from the Apple Silicon runner: the Xcode toolchain
          # there targets x86_64 natively, so no Intel runner is needed.
          - target: x86_64-apple-darwin
            os: macos-latest
            label: macos-x86_64
          # ARM Linux, if you ever want it — the runner label is GA for public
          # repositories, so this is one uncomment away:
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-24.04-arm
          #   label: linux-arm64

    steps:
      # Full history and tags: the version is derived from the highest v* tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the channel
        shell: bash
        run: bash .github/release-identity.sh

      - name: Install the Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # Printed per job on purpose. `rust-toolchain.toml` floats on stable, so
      # the five runners agreeing about which compiler that is cannot be
      # assumed; when a build fails on one platform and not the others, this
      # is the first thing worth ruling out.
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # Separated from the build so that a lockfile the runner disagrees with
      # fails here, saying so, instead of surfacing as a compile step that
      # never compiled anything.
      - name: Fetch the locked dependencies
        shell: bash
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked builds exactly what Cargo.lock pins, vendored rawloader
      # included, so the published binary matches the tree it was built from.
      # Nothing has edited Cargo.toml or Cargo.lock: the version reaches the
      # binary through APILAAA_VERSION, which `build.rs` registers with Cargo
      # and `main.rs` reads with `option_env!`. That is what makes `--locked`
      # a check of the committed files rather than of a pair of files CI
      # rewrote seconds earlier.
      - name: Build
        shell: bash
        env:
          APILAAA_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="apilaaa-${VERSION}-${{ matrix.label }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/apilaaa" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "apilaaa-$env:VERSION-${{ matrix.label }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/apilaaa.exe" $name
          Copy-Item README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    # A manual run stops at the artifacts above: it can be launched from any
    # branch, and only main and tags are allowed to publish.
    if: >-
      github.server_url == 'https://github.com' &&
      github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the channel
        run: bash .github/release-identity.sh

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of an already published version: replace the assets
            # rather than letting Gitea-style suffixed duplicates accumulate.
            gh release upload "$TAG" dist/* --clobber
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" dist/* \
              --title "$TAG" --generate-notes --verify-tag
          else
            # Pushed from main: the tag does not exist yet and is created here,
            # pointing at the commit that was actually built.
            gh release create "$TAG" dist/* \
              --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
