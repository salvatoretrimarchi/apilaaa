[package]
name = "apilaaa"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "RAW astrophotography stacker: star alignment, optical defect removal, linear DNG output and flicker-free timelapse export"

[dependencies]
rawloader = "0.37"
tiff = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# rawloader 0.37.2 (its latest release) has no entry for the Sony A6400, so it
# refuses those files outright. The vendored copy under vendor/rawloader is
# that release with `data/cameras/sony/a6400.toml` added and nothing else
# changed; adding another body is one more file of the same ten lines.
[patch.crates-io]
rawloader = { path = "vendor/rawloader" }
