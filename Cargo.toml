[package]
name = "apilaaa"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RAW astrophotography stacker: star alignment, optical defect removal, linear DNG output and flicker-free timelapse export"

[dependencies]
rawloader = "0.37"
tiff = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
